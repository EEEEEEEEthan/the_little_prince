name: Notify on issue opened

on:
  issues:
    types: [opened]
  workflow_dispatch:

jobs:
  notify:
    name: POST issue payload to webhook
    runs-on: ubuntu-latest
    permissions:
      issues: read

    steps:
      - name: Post webhook if configured
        env:
          JASON_WEBHOOK_URL: ${{ secrets.JASON_WEBHOOK_URL }}
          JASON_WEBHOOK_KEY: ${{ secrets.JASON_WEBHOOK_KEY }}
          REPOSITORY_FULL_NAME: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_HTML_URL: ${{ github.event.issue.html_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          AUTHOR_LOGIN: ${{ github.event.issue.user.login }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          # 未配置仓库密钥时跳过且成功退出，避免 issue 工作流变红
          if [ -z "$JASON_WEBHOOK_URL" ] || [ -z "$JASON_WEBHOOK_KEY" ]; then
            echo "Webhook is not configured"
            exit 0
          fi

          payload="$(jq -n \
            --arg repository_full_name "$REPOSITORY_FULL_NAME" \
            --arg issue_number "$ISSUE_NUMBER" \
            --arg title "$ISSUE_TITLE" \
            --arg html_url "$ISSUE_HTML_URL" \
            --arg body "$ISSUE_BODY" \
            --arg author_login "$AUTHOR_LOGIN" \
            --arg event_action "$EVENT_ACTION" \
            '{
              repository_full_name: $repository_full_name,
              issue_number: (if $issue_number == "" then null else ($issue_number | tonumber) end),
              title: $title,
              html_url: $html_url,
              body: $body,
              author_login: $author_login,
              event_action: $event_action
            }')"

          curl -sS -f -X POST "$JASON_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Key: $JASON_WEBHOOK_KEY" \
            --data "$payload"
