name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    name: Godot headless verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 缓存 Godot 引擎二进制（由 .engine-prepare.sh 写入 ~/.cache/godot-engines/）
      - name: Cache Godot engine
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot-engines
          key: godot-4.8-dev3-standard

      - name: Prepare Godot engine
        run: bash .engine-prepare.sh

      - name: Run verify_arc_planet
        run: |
          # Godot errors return a non-zero status; timeout also fails runs that hang.
          timeout --foreground --kill-after=5s 120s \
            .engine/.engine --headless --path . \
            --script res://tests/verify_arc_planet.gd \
            2>&1 | tee /tmp/verify.log
          # GDScript SceneTree 脚本以 quit(0/1) 结束，timeout/Godot 退出码直接作为 CI 结果
          exit "${PIPESTATUS[0]}"
