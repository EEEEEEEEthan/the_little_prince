name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    name: Godot headless verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # 缓存 Godot 引擎二进制（由 .engine-prepare.sh 写入 ~/.cache/godot-engines/）
      - name: Cache Godot engine
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot-engines
          key: godot-4.8-dev3-standard

      - name: Prepare Godot engine
        run: bash .engine-prepare.sh

      - name: Import project assets
        run: .engine/.engine --headless --path . --import

      - name: Run verify_arc_planet
        run: |
          python3 tests/run_godot_verify.py --timeout 120 -- \
            .engine/.engine --headless --path . \
            --script res://tests/verify_arc_planet.gd \
            2>&1 | tee /tmp/verify.log
          # GDScript SceneTree 脚本以 quit(0/1) 结束，wrapper/Godot 退出码直接作为 CI 结果
          exit "${PIPESTATUS[0]}"
