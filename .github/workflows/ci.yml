name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    name: Godot headless regression
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot engine
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot-engines
          key: godot-4.8-dev3-standard

      - name: Prepare Godot engine
        run: bash .engine-prepare.sh

      - name: Import project assets
        run: .engine/.engine --headless --path . --import

      - name: Run regression
        run: python3 tests/run_regression.py --timeout 180
